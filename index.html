
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jadwal Piket Pleton / Danru</title>
    <style>
        :root {
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            
            /* Tema Orange & Biru Profesional */
            --primary-blue: #0284c7;
            --primary-orange: #f97316;
            
            --morning: #f97316;
            --morning-bg: #fff7ed;
            --night: #0284c7;
            --night-bg: #f0f9ff;
            --off: #059669;
            --off-bg: #ecfdf5;
            --border: #e2e8f0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, -apple-system, sans-serif; }
        
        body { 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            padding: 24px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container { 
            width: 100%; 
            max-width: 580px; 
            background: var(--card-bg); 
            padding: 28px; 
            border-radius: 16px; 
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border);
        }

        /* Header Lurus & Rapi (Menggunakan CSS Grid) */
        .header { 
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 12px;
            border-bottom: 2px solid var(--border);
            padding-bottom: 16px;
            margin-bottom: 24px;
            text-align: center;
        }
        .brand-side {
            font-size: 0.65rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            line-height: 1.3;
        }
        .brand-side.left { text-align: left; border-left: 3px solid var(--primary-orange); padding-left: 8px; }
        .brand-side.right { text-align: right; border-right: 3px solid var(--primary-blue); padding-right: 8px; }

        .header-center h1 { font-size: 1.1rem; font-weight: 700; color: var(--text-main); margin-bottom: 2px; }
        .header-center p { font-size: 0.75rem; color: var(--text-muted); font-weight: 500; }

        /* Card Today (Gradasi Orange - Biru) */
        .card-today {
            background: linear-gradient(135deg, #0284c7, #1e3a8a);
            color: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 24px;
            box-shadow: 0 4px 15px rgba(2, 132, 199, 0.25);
        }
        .card-today h2 { 
            font-size: 0.85rem; 
            text-transform: uppercase; 
            letter-spacing: 0.5px; 
            opacity: 0.9; 
            margin-bottom: 14px; 
        }
        .shift-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; text-align: center; }
        .shift-item { background: rgba(255, 255, 255, 0.12); padding: 12px 8px; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.15); }
        .shift-item span { display: block; font-size: 0.7rem; opacity: 0.85; margin-bottom: 4px; font-weight: 600; letter-spacing: 0.5px; }
        .shift-item strong { font-size: 0.95rem; font-weight: 700; }

        /* Control Input */
        .control-section { margin-bottom: 24px; }
        .control-section label { display: block; font-weight: 600; font-size: 0.85rem; margin-bottom: 8px; color: var(--text-main); }
        input[type="date"] { 
            width: 100%; 
            padding: 12px 14px; 
            border: 1px solid var(--border); 
            border-radius: 10px; 
            font-size: 0.95rem; 
            background: #ffffff;
            color: var(--text-main);
            outline: none;
            transition: all 0.2s ease;
        }
        input[type="date"]:focus { border-color: var(--primary-blue); box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15); }

        /* Result Box */
        .result-box { background: #f8fafc; border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 20px; }
        .result-title { font-size: 0.85rem; font-weight: 600; color: var(--text-muted); margin-bottom: 12px; text-align: center; }
        
        .status-row { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 10px 12px; 
            background: white;
            border-radius: 8px;
            margin-bottom: 8px;
            border: 1px solid var(--border);
        }
        .status-row:last-child { margin-bottom: 0; }
        .pleton-name { font-weight: 600; font-size: 0.9rem; }
        
        .badge { padding: 4px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: 600; }
        .badge.pagi { background: var(--morning-bg); color: var(--morning); border: 1px solid rgba(249, 115, 22, 0.3); }
        .badge.malam { background: var(--night-bg); color: var(--night); border: 1px solid rgba(2, 132, 199, 0.3); }
        .badge.libur { background: var(--off-bg); color: var(--off); border: 1px solid rgba(5, 150, 105, 0.3); }

        /* Watermark */
        .watermark {
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-muted);
            border-top: 1px dashed var(--border);
            padding-top: 14px;
            font-weight: 500;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Header Sejajar Kiri - Tengah - Kanan -->
    <div class="header">
        <div class="brand-side left">TELAGA<br>KAHURIPAN</div>
        <div class="header-center">
            <h1>Jadwal Piket Pleton</h1>
            <p>2 Pagi &bull; 2 Malam &bull; 2 Libur</p>
        </div>
        <div class="brand-side right">PT SPEKTA<br>NAIMANGGALA HAFEEZA</div>
    </div>

    <!-- Status Hari Ini -->
    <div class="card-today">
        <h2>Status Hari Ini</h2>
        <div class="shift-grid">
            <div class="shift-item">
                <span>PAGI</span>
                <strong id="today-pagi">-</strong>
            </div>
            <div class="shift-item">
                <span>MALAM</span>
                <strong id="today-malam">-</strong>
            </div>
            <div class="shift-item">
                <span>LIBUR</span>
                <strong id="today-libur">-</strong>
            </div>
        </div>
    </div>

    <!-- Kontrol Tanggal Pilihan -->
    <div class="control-section">
        <label for="check-date">Cek Jadwal Tanggal Lain</label>
        <input type="date" id="check-date" onchange="hitungJadwal()">
    </div>

    <!-- Hasil Pengecekan -->
    <div class="result-box">
        <div class="result-title" id="result-title">Pilih tanggal untuk melihat rincian</div>
        <div class="status-row">
            <span class="pleton-name">Pleton 01</span>
            <span id="status-p1" class="badge libur">-</span>
        </div>
        <div class="status-row">
            <span class="pleton-name">Pleton 02</span>
            <span id="status-p2" class="badge libur">-</span>
        </div>
        <div class="status-row">
            <span class="pleton-name">Pleton 03</span>
            <span id="status-p3" class="badge libur">-</span>
        </div>
    </div>

    <!-- Watermark -->
    <div class="watermark">
        &copy; 2026-2027 Hapid Sudirman
    </div>
</div>

<script>
    // Siklus 6 hari (Baseline: 10 November 2026 -> Pleton 02 Pagi ke-1)
    const siklus = [
        { p1: "Malam", p2: "Pagi", p3: "Libur" }, // Hari 1 (10 Nov 2026)
        { p1: "Malam", p2: "Pagi", p3: "Libur" }, // Hari 2
        { p1: "Libur", p2: "Malam", p3: "Pagi" }, // Hari 3
        { p1: "Libur", p2: "Malam", p3: "Pagi" }, // Hari 4
        { p1: "Pagi", p2: "Libur", p3: "Malam" }, // Hari 5
        { p1: "Pagi", p2: "Libur", p3: "Malam" }  // Hari 6
    ];

    const baselineDate = new Date(2026, 10, 10); // 10 November 2026

    function getShiftData(targetDate) {
        const diffTime = targetDate - baselineDate;
        const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
        
        let index = diffDays % 6;
        if (index < 0) {
            index = (index + 6) % 6;
        }
        
        const current = siklus[index];
        
        let pagi = [], malam = [], libur = [];
        if (current.p1 === "Pagi") pagi.push("Pleton 01");
        if (current.p2 === "Pagi") pagi.push("Pleton 02");
        if (current.p3 === "Pagi") pagi.push("Pleton 03");

        if (current.p1 === "Malam") malam.push("Pleton 01");
        if (current.p2 === "Malam") malam.push("Pleton 02");
        if (current.p3 === "Malam") malam.push("Pleton 03");

        if (current.p1 === "Libur") libur.push("Pleton 01");
        if (current.p2 === "Libur") libur.push("Pleton 02");
        if (current.p3 === "Libur") libur.push("Pleton 03");

        return {
            p1: current.p1,
            p2: current.p2,
            p3: current.p3,
            textPagi: pagi.join(' & '),
            textMalam: malam.join(' & '),
            textLibur: libur.join(' & ')
        };
    }

    function formatTanggalIndo(dateObj) {
        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        return dateObj.toLocaleDateString('id-ID', options);
    }

    function getBadgeClass(status) {
        if (status === "Pagi") return "badge pagi";
        if (status === "Malam") return "badge malam";
        return "badge libur";
    }

    // Inisialisasi Tampilan Hari Ini Secara Live
    const today = new Date();
    const todayData = getShiftData(today);
    document.getElementById('today-pagi').innerText = todayData.textPagi;
    document.getElementById('today-malam').innerText = todayData.textMalam;
    document.getElementById('today-libur').innerText = todayData.textLibur;

    // Set default input date ke hari ini
    const year = today.getFullYear();
    const month = String(today.getMonth() + 1).padStart(2, '0');
    const day = String(today.getDate()).padStart(2, '0');
    document.getElementById('check-date').value = `${year}-${month}-${day}`;
    hitungJadwal();

    function hitungJadwal() {
        const val = document.getElementById('check-date').value;
        if (!val) return;
        
        const parts = val.split('-');
        const selectedDate = new Date(parts[0], parts[1] - 1, parts[2]);
        
        document.getElementById('result-title').innerText = "Rincian Shift Tgl: " + formatTanggalIndo(selectedDate);
        
        const data = getShiftData(selectedDate);
        
        const elP1 = document.getElementById('status-p1');
        elP1.innerText = "Dinas " + data.p1;
        elP1.className = getBadgeClass(data.p1);

        const elP2 = document.getElementById('status-p2');
        elP2.innerText = "Dinas " + data.p2;
        elP2.className = getBadgeClass(data.p2);

        const elP3 = document.getElementById('status-p3');
        elP3.innerText = "Dinas " + data.p3;
        elP3.className = getBadgeClass(data.p3);
    }
</script>

</body>
</html>
