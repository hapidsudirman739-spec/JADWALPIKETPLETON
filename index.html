<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jadwal Piket Pleton - Maintenance</title>
    <style>
        :root {
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            
            /* Tema Orange & Biru Profesional */
            --primary-blue: #0284c7;
            --primary-orange: #f97316;
            --border: #e2e8f0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, -apple-system, sans-serif; }
        
        body { 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            padding: 24px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container { 
            width: 100%; 
            max-width: 520px; 
            background: var(--card-bg); 
            padding: 36px 28px; 
            border-radius: 16px; 
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border);
            text-align: center;
        }

        /* Header Sejajar Kiri - Tengah - Kanan */
        .header { 
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 12px;
            border-bottom: 2px solid var(--border);
            padding-bottom: 16px;
            margin-bottom: 32px;
            text-align: center;
        }
        .brand-side {
            font-size: 0.65rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            line-height: 1.3;
        }
        .brand-side.left { text-align: left; border-left: 3px solid var(--primary-orange); padding-left: 8px; }
        .brand-side.right { text-align: right; border-right: 3px solid var(--primary-blue); padding-right: 8px; }

        .header-center h1 { font-size: 1.05rem; font-weight: 700; color: var(--text-main); margin-bottom: 2px; }
        .header-center p { font-size: 0.7rem; color: var(--text-muted); font-weight: 500; }

        /* Maintenance Box */
        .maintenance-box {
            background: linear-gradient(135deg, #f0f9ff, #fff7ed);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 28px 20px;
            margin-bottom: 24px;
        }

        .icon-gear {
            font-size: 2.8rem;
            margin-bottom: 12px;
            display: inline-block;
            animation: spin 6s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .maintenance-box h2 {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        .maintenance-box p {
            font-size: 0.88rem;
            color: var(--text-muted);
            line-height: 1.5;
            margin-bottom: 16px;
        }

        /* Badge Sistem */
        .sys-badge {
            display: inline-block;
            background: #1e293b;
            color: #38bdf8;
            font-family: monospace;
            font-size: 0.75rem;
            padding: 4px 10px;
            border-radius: 6px;
            letter-spacing: 0.5px;
        }

        /* Status Badge */
        .status-badge {
            display: inline-block;
            background: #fff7ed;
            color: var(--primary-orange);
            border: 1px solid rgba(249, 115, 22, 0.3);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.78rem;
            font-weight: 600;
            margin-bottom: 24px;
        }

        /* Watermark */
        .watermark {
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-muted);
            border-top: 1px dashed var(--border);
            padding-top: 16px;
            font-weight: 500;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Header Sejajar Kiri - Tengah - Kanan -->
    <div class="header">
        <div class="brand-side left">TELAGA<br>KAHURIPAN</div>
        <div class="header-center">
            <h1>Jadwal Piket Pleton</h1>
            <p>Sistem Rotasi Pleton</p>
        </div>
        <div class="brand-side right">PT SPEKTA<br>NAIMANGGALA HAFEEZA</div>
    </div>

    <!-- Konten Maintenance -->
    <div class="maintenance-box">
        <div class="icon-gear">⚙️</div>
        <h2>Situs Sedang Maintenance</h2>
        <p>Sistem jadwal piket sedang dalam pemeliharaan berkala untuk peningkatan performa layanan.</p>
        <div class="sys-badge">system by hapid.sys</div>
    </div>

    <div class="status-badge">
        Status: Under Maintenance 🛠️
    </div>

    <!-- Watermark -->
    <div class="watermark">
        &copy; 2026-2027 Hapid Sudirman
    </div>
</div>

<script>
    console.log("[SYSTEM LOG] Status: MAINTENANCE MODE ACTIVE.");
    console.log("[DEPLOYED BY] hapid.sys");
</script>

</body>
</html>
